schema: spec-driven
githubCopilot:
  cloudAgent: true

context: |
  Product: Python domain/service with a Unity WebGL client. The Python service is authoritative for character-creation requests and saved drafts; Unity presents the workflow. See README.md for architecture, setup, and test commands.
  Preserve ruleset-package and asset provenance, version, and license metadata when changing bundled content.
  The root MIT license applies only to original application code. See THIRD_PARTY_NOTICES.md for separate or unresolved terms.

rules:
  proposal:
    - "Keep proposals under 400 words."
    - "Structure strictly into: Why, What Changes, Capabilities, and Impact."
    - "Omit speculative future roadmaps or unrequested features."
  specs:
    - Group requirements into max 3-5 core items per capability.
    - Write concise declarative scenarios; avoid combinatorial test cases.
  design:
    - Keep design docs under 600 words.
    - Focus strictly on architecture, state boundaries, and data contracts.
    - Use plain ASCII diagrams; do not duplicate raw spec requirements or code blocks.
  tasks:
    - Limit change plans to 5-8 atomic tasks.
    - Every task MUST include a single-line verification command.

operations:
  apply:
    guidance:
      - Work strictly on one task at a time; do not implement future tasks prematurely.
      - Pipe build and test output to keep logs under 15 lines.
      - Do not re-read files unless modified or directly needed for the active task.
  archive:
    guidance:
      - Summarize the final archive outcome in under 100 words.
